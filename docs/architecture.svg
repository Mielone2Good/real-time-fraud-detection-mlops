<svg xmlns="http://www.w3.org/2000/svg" width="830" height="300" viewBox="0 0 830 300">
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .box{fill:#18181b;stroke:#2e2e33}
    .hot{fill:#1c1410;stroke:#f97316}
    .t{fill:#fafafa;font-size:13px}
    .s{fill:#71717a;font-size:11px}
    .l{fill:#a1a1aa;font-size:10.5px}
    .a{stroke:#52525b;stroke-width:1.5;fill:none;marker-end:url(#h)}
    .ao{stroke:#f97316;stroke-width:1.5;fill:none;marker-end:url(#ho)}
    .flow{stroke:#f97316;stroke-width:1.5;fill:none;stroke-dasharray:4 8;animation:f 1.2s linear infinite}
    @keyframes f{to{stroke-dashoffset:-12}}
  </style>
  <defs>
