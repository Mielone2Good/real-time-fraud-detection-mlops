  <path class="a" d="M522 229H494"/><text x="496" y="190" class="m l" text-anchor="end">register</text><text x="496" y="203" class="m l" text-anchor="end">+ promote</text>
  <path class="a" d="M425 200V118"/><text x="433" y="152" class="m l">hot reload</text>
